<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Survey</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f5f7fa;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
    }

    .container {
        background: white;
        margin-top: 40px;
        padding: 25px 30px;
        border-radius: 10px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        max-width: 750px;
        width: 90%;
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
    }

    #message {
        font-size: 1.2rem;
        text-align: center;
        color: #444;
        padding: 20px;
    }

    iframe {
        width: 100%;
        height: 900px;
        border: none;
        border-radius: 8px;
    }
</style>
</head>

<body>
<div class="container">
    <h1>Survey</h1>
    <div id="message"></div>
    <div id="formContainer"></div>
</div>

<script>
// Detect Microsoft Forms "Thank You" redirect
if (window.location.href.includes("FormResponse")) {
    localStorage.setItem("submittedMSForm", "true");
}

// On page load, decide whether to show the form
window.onload = function () {
    const hasSubmitted = localStorage.getItem("submittedMSForm") === "true";

    if (hasSubmitted) {
        document.getElementById("message").innerText =
            "Thank you — you have already submitted this form.";
        return;
    }

    // Show the Microsoft Form
    document.getElementById("formContainer").innerHTML = `
        <iframe
            src="https://forms.office.com/r/ETza9fTvdr"
            allowfullscreen>
        </iframe>
    `;
};
</script>

</body>
</html>
