<script>
const REDIRECT_URL = "https://www.howardcc.edu/programs-courses/academics/departments/engineering/";
const THREE_MONTHS_MS = 90 * 24 * 60 * 60 * 1000;

const submitted = localStorage.getItem("submittedMSForm") === "true";
const submittedAt = parseInt(localStorage.getItem("submittedAt") || "0", 10);
const now = Date.now();

if (submitted && (now - submittedAt) < THREE_MONTHS_MS) {
    window.location.href = REDIRECT_URL;
}
</script>

<iframe
    src="YOUR_FINAL_MICROSOFT_FORMS_URL_WITH_REDIRECT"
    width="100%" height="900" frameborder="0">
